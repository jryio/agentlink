name: CI
on:
  push: { branches: [main] }
  pull_request: {}
permissions: { contents: read }
env:
  GOTOOLCHAIN: local
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25.x", "1.26.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          { go-version: "${{ matrix.go }}", cache: true, check-latest: true }
      - uses: arduino/setup-task@v2
        with: { version: 3.x, repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - run: task tidy
      - name: Verify module metadata is tidy
        run: git diff --exit-code -- go.mod go.sum
      - run: task cover
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.x", check-latest: true }
      - name: Select weekly linter cache epoch
        id: linter-cache-epoch
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache custom-gcl (golangci-lint + NilAway plugin)
        id: custom-gcl-cache
        uses: actions/cache@v4
        with:
          path: ./custom-gcl
          # Bust weekly so `latest` NilAway versions get picked up.
          key: custom-gcl-${{ runner.os }}-${{ hashFiles('.custom-gcl.yml', 'go.mod') }}-${{ steps.linter-cache-epoch.outputs.week }}
          restore-keys: |
            custom-gcl-${{ runner.os }}-${{ hashFiles('.custom-gcl.yml', 'go.mod') }}-
      - name: Build custom-gcl with NilAway
        if: steps.custom-gcl-cache.outputs.cache-hit != 'true'
        run: |
          go install tool
          go tool golangci-lint custom
      - name: Run custom-gcl
        run: ./custom-gcl run --timeout=5m ./...
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.x", check-latest: true }
      - uses: golang/govulncheck-action@v1
        with:
          { go-version-input: "1.26.x", check-latest: true, go-package: ./... }
