version: "2"

run:
  timeout: 5m

linters:
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilaway
    - noctx
    - nolintlint
    - prealloc
    - revive
    - sqlclosecheck
    - unconvert
    - unparam
    - wastedassign
  settings:
    errorlint:
      errorf: true
    gosec:
      excludes:
        - G104 # duplicated by errcheck
    nolintlint:
      require-explanation: true
      require-specific: true
    custom:
      nilaway:
        type: module
        description: Static analysis tool to detect potential nil panics in Go code.
        settings:
          # include-pkgs scopes analysis to first-party code; without it NilAway
          # walks stdlib + every dependency and produces unactionable noise.
          include-pkgs: "github.com/jryio/agentlink"
          exclude-file-docstrings: "@generated,Code generated by,Autogenerated by"
          group-error-messages: "true"
          exclude-test-files: "false"

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/jryio/agentlink)
